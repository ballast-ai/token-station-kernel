name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Boundary gate
        run: scripts/check-boundaries.sh

  # Weekly freshness probe: fails when upstream has a newer release tag than
  # the mirror records, telling maintainers to run scripts/sync-upstream.sh.
  # A failing scheduled run is the alert channel; it gates nothing else.
  upstream-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare mirror state with the newest upstream release tag
        run: |
          mirrored=$(python3 -c "import json; print(json.load(open('compatibility.json'))['mirror']['source_tag'])")
          latest=$(git ls-remote --tags https://github.com/ballast-ai/token-station.git 'v*' \
            | awk '{print $2}' | sed 's#refs/tags/##; s#\^{}##' | sort -uV | tail -1)
          echo "mirrored=$mirrored latest=$latest"
          if [ -z "$latest" ]; then
            echo "::error::could not list upstream tags"
            exit 1
          fi
          if [ "$mirrored" != "$latest" ]; then
            echo "::error::mirror is at $mirrored but upstream's newest release tag is $latest — run scripts/sync-upstream.sh --tag $latest"
            exit 1
          fi
